<mat-toolbar 
  class="navbar" 
  [class.scrolled]="isScrolled"
  color="primary">
  
  <!-- Logo/Brand -->
  <div class="navbar-brand" routerLink="/">
    <mat-icon class="brand-icon">balance</mat-icon>
    <span class="brand-name">IurisDoc</span>
  </div>

  <!-- Desktop Navigation Links -->
  <div class="nav-links desktop-nav">
    @for (item of navItems; track item.path) {
      <a 
        mat-button 
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-link">
        <mat-icon>{{item.icon}}</mat-icon>
        {{item.label}}
      </a>
    }
  </div>

  <!-- Desktop Action Buttons -->
  <div class="nav-actions desktop-actions">
    <button mat-icon-button aria-label="Search">
      <mat-icon>search</mat-icon>
    </button>
    
    <button mat-icon-button aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
    </button>
    
    <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-btn">
      <mat-icon>account_circle</mat-icon>
    </button>

    <button mat-raised-button color="accent" class="cta-btn">
      Get Started
    </button>
  </div>

  <!-- Mobile Menu Button -->
  <button 
    class="mobile-menu-btn" 
    mat-icon-button 
    (click)="toggleMobileMenu()"
    aria-label="Toggle menu">
    <mat-icon>{{isMobileMenuOpen ? 'close' : 'menu'}}</mat-icon>
  </button>
</mat-toolbar>

<!-- Mobile Menu Drawer -->
<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <!-- Mobile Navigation Links -->
  <div class="mobile-nav-links">
    @for (item of navItems; track item.path) {
      <a 
        mat-list-item 
        [routerLink]="item.path"
        routerLinkActive="active-mobile-link"
        (click)="closeMobileMenu()">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span>{{item.label}}</span>
      </a>
    }
    
    <mat-divider></mat-divider>
    
    <!-- Mobile Actions -->
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>search</mat-icon>
      <span>Search</span>
    </a>
    
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>notifications</mat-icon>
      <span>Notifications</span>
    </a>
    
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </a>
    
    <button mat-raised-button color="accent" class="mobile-cta" (click)="closeMobileMenu()">
      Get Started
    </button>
  </div>
</div>

<!-- Profile Menu -->
<mat-menu #profileMenu="matMenu" class="profile-menu">
  <button mat-menu-item>
    <mat-icon>account_circle</mat-icon>
    <span>Profile</span>
  </button>
  
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  
  <button mat-menu-item>
    <mat-icon>help</mat-icon>
    <span>Help</span>
  </button>
  
  <mat-divider></mat-divider>
  
  <button mat-menu-item>
    <mat-icon>logout</mat-icon>
    <span>Logout</span>
  </button>
</mat-menu>
