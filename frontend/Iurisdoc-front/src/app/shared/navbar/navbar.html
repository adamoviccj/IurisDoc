<mat-toolbar 
  class="navbar" 
  [class.scrolled]="isScrolled"
  color="primary">
  
  <!-- Logo/Brend -->
  <div class="navbar-brand" routerLink="/">
    <mat-icon class="brand-icon">balance</mat-icon>
    <span class="brand-name">IurisDoc</span>
  </div>

  <!-- Desktop navigacija -->
  <div class="nav-links desktop-nav">
    @for (item of navItems; track item.path) {
      <a 
        mat-button 
        [routerLink]="item.path"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{exact: true}"
        class="nav-link">
        <mat-icon>{{item.icon}}</mat-icon>
        {{item.label}}
      </a>
    }
  </div>

  <!-- Desktop dugmad akcija -->
  <div class="nav-actions desktop-actions">
    <button mat-icon-button aria-label="Pretraga">
      <mat-icon>search</mat-icon>
    </button>
    
    <button mat-icon-button aria-label="Obavještenja">
      <mat-icon>notifications</mat-icon>
    </button>
    
    <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-btn">
      <mat-icon>account_circle</mat-icon>
    </button>

    <button mat-raised-button color="accent" class="cta-btn"    routerLink="/generate-judgment">
      Započni
    </button>
  </div>

  <!-- Dugme za mobilni meni -->
  <button 
    class="mobile-menu-btn" 
    mat-icon-button 
    (click)="toggleMobileMenu()"
    aria-label="Otvori meni">
    <mat-icon>{{isMobileMenuOpen ? 'close' : 'menu'}}</mat-icon>
  </button>
</mat-toolbar>

<!-- Mobilni meni -->
<div class="mobile-menu" [class.open]="isMobileMenuOpen">
  <!-- Linkovi -->
  <div class="mobile-nav-links">
    @for (item of navItems; track item.path) {
      <a 
        mat-list-item 
        [routerLink]="item.path"
        routerLinkActive="active-mobile-link"
        (click)="closeMobileMenu()">
        <mat-icon matListItemIcon>{{item.icon}}</mat-icon>
        <span>{{item.label}}</span>
      </a>
    }
    
    <mat-divider></mat-divider>
    
    <!-- Mobilne akcije -->
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>search</mat-icon>
      <span>Pretraga</span>
    </a>
    
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>notifications</mat-icon>
      <span>Obavještenja</span>
    </a>
    
    <a mat-list-item (click)="closeMobileMenu()">
      <mat-icon>settings</mat-icon>
      <span>Podešavanja</span>
    </a>
    
    <button mat-raised-button color="accent" class="mobile-cta" (click)="closeMobileMenu()">
      Započni
    </button>
  </div>
</div>

<!-- Profil meni -->
<mat-menu #profileMenu="matMenu" class="profile-menu">
  <button mat-menu-item>
    <mat-icon>account_circle</mat-icon>
    <span>Profil</span>
  </button>
  
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Podešavanja</span>
  </button>
  
  <button mat-menu-item>
    <mat-icon>help</mat-icon>
    <span>Pomoć</span>
  </button>
  
  <mat-divider></mat-divider>
  
  <button mat-menu-item>
    <mat-icon>logout</mat-icon>
    <span>Odjava</span>
  </button>
</mat-menu>
